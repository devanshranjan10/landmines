[project]
name = "uvproj"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "requests[socks]>=2.31",
  "beautifulsoup4",
  "PyYAML>=6",
  "python-dateutil; python_version >= '3.8'",
