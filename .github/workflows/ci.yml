name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.12.0', 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      # The packed package must install and run from an empty directory.
      - name: pack smoke test
        shell: bash
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/landmines-*.tgz
          npx landmines --version
          npx landmines --help >/dev/null
          printf '{"name":"smoke","version":"1.0.0","lockfileVersion":3,"packages":{"":{"dependencies":{"zod":"3.23.8"}},"node_modules/zod":{"version":"3.23.8"}}}' > package-lock.json
          npx landmines scan --offline -q
  bench-validate:
    # Every benchmark task still fails with the naive solution and passes with the workaround.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci && npm run build
      - run: uv python install 3.12 && bench/setup.sh
      - run: npx tsx scripts/bench/validate.ts
