name: release
# On a version tag (v0.2.1): publish to npm unless that version is already there, then list the same version in the
# official MCP Registry (registry.modelcontextprotocol.io) as tech.landmine/landmine, with the npm package (stdio) and
# the hosted server https://landmine.tech/mcp.
# npm auth: the NPM_TOKEN secret if set, otherwise npm trusted publishing (configure it once on npmjs.com:
# package settings → Trusted publisher → GitHub Actions, repo devanshranjan10/landmines, workflow release.yml).
# The MCP Registry proves the landmine.tech namespace with the Ed25519 key whose public half is served at
# https://landmine.tech/.well-known/mcp-registry-auth (private half: the MCP_REGISTRY_PRIVATE_KEY secret), and checks
# package.json `mcpName` in the published npm version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: tag, package.json and server.json agree
        run: |
          v=$(node -p "require('./package.json').version")
          test "$GITHUB_EVENT_NAME" != push || test "v$v" = "$GITHUB_REF_NAME"
          test "$(node -p "require('./server.json').version")" = "$v"
          test "$(node -p "require('./server.json').packages[0].version")" = "$v"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: npm publish (skipped if this version is already on npm)
        run: |
          if npm view "landmines@$VERSION" version >/dev/null 2>&1; then echo "landmines@$VERSION is already on npm"; exit 0; fi
          npm install -g npm@latest   # trusted publishing needs npm >= 11.5
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.2/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login http --domain landmine.tech --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish
          # 0.2.1 was listed as io.github.devanshranjan10/landmines; keep that name deprecated in favour of this one.
          ./mcp-publisher login github-oidc
          ./mcp-publisher status --status deprecated --all-versions --message "Moved to tech.landmine/landmine" io.github.devanshranjan10/landmines || true
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
